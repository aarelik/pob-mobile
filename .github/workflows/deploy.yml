# Builds the site from upstream Path of Building at the commit pinned in
# pob.json and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned upstream commit
        id: pin
        run: |
          echo "repo=$(jq -r '.poe1.repo' pob.json | sed 's#https://github.com/##')" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r '.poe1.commit' pob.json)" >> "$GITHUB_OUTPUT"

      - name: Check out upstream Path of Building
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream/PathOfBuilding
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.6
          actions-cache-folder: emsdk-cache

      - name: Build the engine (WebAssembly)
        run: ./engine/build-wasm.sh

      - name: Stage and pack Path of Building
        run: |
          node scripts/sync-pob.mjs --game poe1
          node scripts/pack-pob.mjs poe1

      - name: Smoke test the engine on upstream's test builds
        run: node engine/test/wasm-smoke.mjs upstream/PathOfBuilding/spec/TestBuilds/3.13/*.xml

      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
